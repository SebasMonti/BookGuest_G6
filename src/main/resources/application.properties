spring.application.name=bookguest

# Puerto local; Render inyecta PORT automáticamente
server.port=${PORT:91}
server.forward-headers-strategy=framework

# Formato de fecha/hora en el log
logging.pattern.dateformat=hh:mm

# Elimina el banner de Spring al iniciar
spring.main.banner-mode=off

# Se puede activar en Render con THYMELEAF_CACHE=true
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# MySQL local por defecto. Para Aiven se configuran DB_HOST, DB_PORT,
# DB_NAME, DB_USERNAME, DB_PASSWORD y DB_SSL_MODE=REQUIRED.
#spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bookguest}?sslMode=${DB_SSL_MODE:DISABLED}&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.url=jdbc:mysql://${DB_HOST:bookguest-dannyfgarcia85-4e9d.e.aivencloud.com}:${DB_PORT:26696}/${DB_NAME:defaultdb}?sslMode=${DB_SSL_MODE:REQUIRED}&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8

# Usuario y clave de la base de datos
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Driver de MySQL. Hibernate detecta el dialecto desde la conexión.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=none

# El SQL detallado queda desactivado por defecto para no saturar Render
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# Internacionalizacion
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Firebase Storage
# De momento se deja preparado, primero se trabaja en localhost
firebase.bucket.name=${FIREBASE_BUCKET_NAME:bookguest-36f8e.firebasestorage.app}
firebase.storage.path=${FIREBASE_STORAGE_PATH:bookguest}
# En Render use FIREBASE_CREDENTIALS_BASE64 o FIREBASE_CREDENTIALS_PATH.
firebase.credentials.base64=${FIREBASE_CREDENTIALS_BASE64:}
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}
# Respaldo local compatible con NetBeans.
firebase.json.path=firebase
firebase.json.file=bookguest-36f8e-firebase-adminsdk-fbsvc-c4bbaa9be2.json
