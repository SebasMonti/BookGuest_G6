<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
    <head th:fragment="head(titulo)">
        <title>[[${titulo}]] - [[#{aplicacion.titulo}]]</title>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet"/>
        <link th:href="@{/webjars/font-awesome/7.2.0/css/all.css}" rel="stylesheet"/>
        <style>
            :root {
                --admin-blue: #004A78;
                --admin-bg: #F0F1F3;
                --admin-sidebar: #FFFFFF;
                --admin-text: #303846;
                --admin-muted: #667085;
                --admin-border: #E2E6EC;
                --admin-active-bg: #EEF6FF;
                --admin-active-text: #0D6EFD;
            }

            html, body {
                width: 100%;
                min-height: 100%;
                margin: 0;
                background-color: var(--admin-bg);
                font-family: Arial, Helvetica, sans-serif;
                color: var(--admin-text);
            }

            .admin-layout {
                min-height: 100vh;
                display: flex;
                background-color: var(--admin-bg);
            }

            .admin-sidebar {
                width: 250px;
                min-height: 100vh;
                background-color: var(--admin-sidebar);
                border-right: 1px solid var(--admin-border);
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                flex-shrink: 0;
                padding: 28px 26px;
                box-shadow: 2px 0 12px rgba(15, 23, 42, 0.03);
            }

            .admin-sidebar-top {
                display: block;
            }

            .admin-brand {
                display: flex;
                align-items: center;
                gap: 10px;
                color: var(--admin-blue);
                font-weight: 700;
                font-size: 18px;
                margin-bottom: 58px;
                text-decoration: none;
            }

            .admin-brand i {
                font-size: 36px;
            }

            .admin-menu {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .admin-menu a {
                display: flex;
                align-items: center;
                gap: 14px;
                width: 100%;
                min-height: 42px;
                padding: 10px 12px;
                border: 0;
                border-radius: 8px;
                background-color: transparent;
                color: #344054;
                font-size: 14px;
                text-decoration: none;
                text-align: left;
                transition: background-color 0.15s ease, color 0.15s ease;
            }

            .admin-menu a:hover {
                background-color: var(--admin-active-bg);
                color: var(--admin-active-text);
            }

            .admin-menu a.active {
                background-color: var(--admin-active-bg);
                color: var(--admin-active-text);
                font-weight: 600;
            }

            .admin-menu i {
                width: 18px;
                text-align: center;
                font-size: 15px;
            }

            .admin-main {
                flex: 1;
                min-width: 0;
                min-height: 100vh;
                background-color: var(--admin-bg);
            }

            .admin-topbar {
                height: 82px;
                background-color: #FFFFFF;
                border-bottom: 1px solid var(--admin-border);
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 42px;
            }

            .admin-search {
                width: 355px;
                height: 36px;
                border: 1px solid var(--admin-border);
                border-radius: 5px;
                background-color: #FFFFFF;
                display: flex;
                align-items: center;
                padding: 0 14px;
                gap: 10px;
                color: #98A2B3;
            }

            .admin-search input {
                width: 100%;
                border: 0;
                outline: 0;
                background-color: transparent;
                font-size: 13px;
                color: var(--admin-text);
            }

            .admin-search input::placeholder {
                color: #98A2B3;
            }

            .admin-top-icons {
                display: flex;
                align-items: center;
                gap: 18px;
                color: #344054;
                font-size: 18px;
            }

            .admin-language {
                min-width: 96px;
                height: 36px;
                border: 1px solid var(--admin-border);
                border-radius: 6px;
                background-color: #FFFFFF;
                color: #344054;
                padding: 0 30px 0 10px;
                font-size: 13px;
                cursor: pointer;
            }

            .admin-language:focus-visible {
                border-color: var(--admin-active-text);
                box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.13);
                outline: 0;
            }

            .admin-avatar-link {
                width: 38px;
                height: 38px;
                border-radius: 50%;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
                color: #344054;
                text-decoration: none;
                flex-shrink: 0;
                border: 0;
                padding: 0;
                background-color: transparent;
                cursor: pointer;
            }

            .admin-avatar-link:hover,
            .admin-avatar-link:focus-visible,
            .admin-avatar-link[aria-expanded="true"] {
                color: var(--admin-active-text);
                box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.13);
                outline: 0;
            }

            .admin-avatar-image {
                width: 100%;
                height: 100%;
                border-radius: 50%;
                border: 1px solid var(--admin-border);
                object-fit: cover;
            }

            .admin-avatar-fallback {
                width: 100%;
                height: 100%;
                border: 1px solid var(--admin-border);
                border-radius: 50%;
                align-items: center;
                justify-content: center;
                background-color: #F2F4F7;
                font-size: 17px;
            }

            .admin-account-menu {
                width: 250px;
                margin-top: 12px !important;
                padding: 10px;
                border: 1px solid #E5E7EB;
                border-radius: 10px;
                box-shadow: 0 14px 35px rgba(17, 24, 39, 0.14);
            }

            .admin-account-summary {
                display: flex;
                align-items: center;
                gap: 11px;
                padding: 8px 8px 12px;
                border-bottom: 1px solid #EEF0F3;
                margin-bottom: 6px;
            }

            .admin-account-summary .admin-avatar-image,
            .admin-account-summary .admin-avatar-fallback {
                width: 42px;
                height: 42px;
                flex: 0 0 42px;
            }

            .admin-account-name {
                color: #111827;
                font-size: 13px;
                font-weight: 700;
                line-height: 1.3;
                overflow-wrap: anywhere;
            }

            .admin-account-option {
                width: 100%;
                min-height: 40px;
                border: 0;
                border-radius: 7px;
                background-color: transparent;
                color: #1F2937;
                display: flex;
                align-items: center;
                gap: 11px;
                padding: 9px 10px;
                text-decoration: none;
                font-family: Arial, Helvetica, sans-serif;
                font-size: 13px;
                text-align: left;
                cursor: pointer;
            }

            .admin-account-option i {
                width: 18px;
                color: #6B7280;
                text-align: center;
            }

            .admin-account-option:hover,
            .admin-account-option:focus-visible {
                background-color: #F3F6FA;
                color: var(--admin-blue);
                outline: 0;
            }

            .admin-account-logout {
                margin: 0;
            }

            .admin-content {
                padding: 24px 28px 40px 28px;
                background-color: var(--admin-bg);
            }

            .admin-card {
                background-color: #FFFFFF;
                border-radius: 8px;
                border: 1px solid var(--admin-border);
            }

            .admin-card-title {
                font-size: 18px;
                font-weight: 500;
                margin-bottom: 20px;
            }

            .metric-grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
            }

            .metric-grid.two {
                grid-template-columns: repeat(2, 1fr);
            }

            .metric-item {
                text-align: center;
                padding: 20px 10px;
                border-right: 1px solid var(--admin-border);
            }

            .metric-item:last-child {
                border-right: 0;
            }

            .metric-icon {
                width: 34px;
                height: 34px;
                border-radius: 6px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                margin-bottom: 12px;
                font-size: 18px;
            }

            .metric-value {
                font-size: 15px;
                color: var(--admin-text);
                margin-bottom: 4px;
            }

            .metric-label {
                font-size: 12px;
                color: #536072;
            }

            .table-admin {
                font-size: 13px;
                margin-bottom: 0;
            }

            .table-admin th {
                font-weight: 500;
                color: #536072;
                border-color: var(--admin-border);
            }

            .table-admin td {
                color: #303846;
                border-color: var(--admin-border);
                padding-top: 18px;
                padding-bottom: 18px;
            }

            .stock-item {
                display: flex;
                align-items: center;
                gap: 16px;
                margin-bottom: 16px;
            }

            .stock-cover {
                width: 40px;
                height: 58px;
                object-fit: cover;
                border-radius: 2px;
                background-color: #D9DEE7;
            }

            .stock-title {
                font-size: 13px;
                font-weight: 600;
                margin-bottom: 4px;
            }

            .stock-subtitle {
                font-size: 12px;
                color: #7B8496;
            }

            .stock-badge {
                background-color: #FFE7E7;
                color: #F04444;
                font-size: 11px;
                border-radius: 12px;
                padding: 6px 8px;
                margin-left: auto;
            }

            .chart-box {
                height: 205px;
                position: relative;
                padding: 18px 14px;
            }

            .chart-svg {
                width: 100%;
                height: 150px;
            }

            .chart-legend {
                display: flex;
                justify-content: center;
                gap: 26px;
                font-size: 12px;
                color: #7B8496;
            }

            .legend-dot {
                width: 12px;
                height: 12px;
                border-radius: 50%;
                display: inline-block;
                margin-right: 6px;
            }

            @media (max-width: 992px) {
                .admin-layout {
                    display: block;
                }

                .admin-sidebar {
                    width: 100%;
                    min-height: auto;
                    padding: 20px;
                    border-right: 0;
                    border-bottom: 1px solid var(--admin-border);
                }

                .admin-brand {
                    margin-bottom: 22px;
                }

                .admin-topbar {
                    height: auto;
                    padding: 18px;
                    gap: 18px;
                }

                .admin-search {
                    width: 100%;
                }
            }
        </style>
    </head>
    <aside th:fragment="sidebar(activo)" class="admin-sidebar">
        <div class="admin-sidebar-top">
            <a th:href="@{/admin/dashboard}" class="admin-brand">
                <i class="fa-solid fa-book-bookmark"></i>
                <span>[[#{aplicacion.titulo}]]</span>
            </a>
            <nav class="admin-menu">
                <a th:href="@{/admin/dashboard}" th:classappend="${activo == 'dashboard'} ? 'active'">
                    <i class="fa-solid fa-house"></i>
                    <span>[[#{plantilla.dashboard}]]</span>
                </a>
                <a th:href="@{/admin/inventario}" th:classappend="${activo == 'inventario'} ? 'active'">
                    <i class="fa-solid fa-dolly"></i>
                    <span>[[#{plantilla.inventario}]]</span>
                </a>
                <a th:href="@{/admin/usuarios}" th:classappend="${activo == 'usuarios'} ? 'active'">
                    <i class="fa-regular fa-circle-user"></i>
                    <span>[[#{plantilla.usuarios}]]</span>
                </a>
                <a th:href="@{/admin/pedidos}" th:classappend="${activo == 'pedidos'} ? 'active'">
                    <i class="fa-regular fa-clipboard"></i>
                    <span>[[#{plantilla.pedidos}]]</span>
                </a>
                <a th:href="@{/admin/productos}" th:classappend="${activo == 'productos'} ? 'active'">
                    <i class="fa-regular fa-rectangle-list"></i>
                    <span>[[#{plantilla.productos}]]</span>
                </a>
            </nav>
        </div>
    </aside>
    <header th:fragment="topbar" class="admin-topbar">
        <div class="admin-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" th:placeholder="#{admin.buscar.placeholder}"/>
        </div>
        <div class="admin-top-icons">
            <label for="adminLanguage" class="visually-hidden">[[#{plantilla.idioma}]]</label>
            <select id="adminLanguage"
                    class="admin-language"
                    th:attr="aria-label=#{plantilla.idioma}"
                    onchange="cambiarIdiomaAdministrador(this.value)">
                <option value="es" th:selected="${#locale.language == 'es'}">[[#{idioma.es}]]</option>
                <option value="en" th:selected="${#locale.language == 'en'}">[[#{idioma.en}]]</option>
            </select>
            <div class="dropdown">
                <button type="button"
                        class="admin-avatar-link"
                        data-bs-toggle="dropdown"
                        aria-expanded="false"
                        th:attr="aria-label=#{admin.cuenta.abrir},title=#{admin.cuenta.abrir}">
                    <img th:if="${usuarioSesion != null and usuarioSesion.rutaImagen != null and !usuarioSesion.rutaImagen.isBlank()}"
                         th:src="${usuarioSesion.rutaImagen}"
                         th:alt="|${usuarioSesion.nombre} ${usuarioSesion.apellidos}|"
                         class="admin-avatar-image"
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"/>

                    <span class="admin-avatar-fallback"
                          th:style="${usuarioSesion != null and usuarioSesion.rutaImagen != null and !usuarioSesion.rutaImagen.isBlank()} ? 'display:none' : 'display:flex'">
                        <i class="fa-solid fa-user"></i>
                    </span>
                </button>
                <div class="dropdown-menu dropdown-menu-end admin-account-menu">
                    <div class="admin-account-summary">
                        <img th:if="${usuarioSesion != null and usuarioSesion.rutaImagen != null and !usuarioSesion.rutaImagen.isBlank()}"
                             th:src="${usuarioSesion.rutaImagen}"
                             th:alt="|${usuarioSesion.nombre} ${usuarioSesion.apellidos}|"
                             class="admin-avatar-image"
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"/>

                        <span class="admin-avatar-fallback"
                              th:style="${usuarioSesion != null and usuarioSesion.rutaImagen != null and !usuarioSesion.rutaImagen.isBlank()} ? 'display:none' : 'display:flex'">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <div class="admin-account-name">
                            <span th:if="${usuarioSesion != null}"
                                  th:text="|${usuarioSesion.nombre} ${usuarioSesion.apellidos}|">
                                Usuario BookGuest
                            </span>
                            <span th:if="${usuarioSesion == null}">[[#{plantilla.perfil}]]</span>
                        </div>
                    </div>
                    <a th:href="@{/admin/configuracion}" class="admin-account-option">
                        <i class="fa-solid fa-gear"></i>
                        <span>[[#{plantilla.configuracion}]]</span>
                    </a>
                    <form th:action="@{/logout}" method="post" class="admin-account-logout">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="admin-account-option">
                            <i class="fa-solid fa-arrow-right-from-bracket"></i>
                            <span>[[#{plantilla.cerrarSesion}]]</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </header>
    <section th:fragment="scripts">
        <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
        <script>
            function cambiarIdiomaAdministrador(idioma) {
                if (!idioma) {
                    return;
                }

                const url = new URL(window.location.href);
                url.searchParams.set("lang", idioma);
                window.location.assign(url.toString());
            }
        </script>
    </section>
</html>
