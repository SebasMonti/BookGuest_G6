<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
    <head th:replace="~{cliente/fragmentos :: head(#{cliente.favoritos.titulo})}"></head>
    <body>
        <header th:replace="~{cliente/fragmentos :: header('favoritos')}"></header>
        <main class="client-page favorites-page">
            <style>
                .favorites-page {
                    min-height: calc(100vh - 140px);
                    padding-top: 48px;
                    padding-bottom: 68px;
                }

                .favorites-heading {
                    display: flex;
                    align-items: flex-end;
                    justify-content: space-between;
                    gap: 24px;
                    margin-bottom: 34px;
                }

                .favorites-kicker {
                    display: flex;
                    align-items: center;
                    gap: 10px;
                    color: #003F63;
                    font-size: 13px;
                    font-weight: 600;
                    margin-bottom: 10px;
                }

                .favorites-kicker::before {
                    content: "";
                    width: 8px;
                    height: 28px;
                    border-radius: 2px;
                    background-color: #0D4F8B;
                }

                .favorites-title {
                    margin: 0;
                    color: #111827;
                    font-size: clamp(28px, 3vw, 38px);
                }

                .favorites-description {
                    color: #667085;
                    font-size: 14px;
                    margin: 8px 0 0;
                }

                .favorites-count {
                    border-radius: 999px;
                    background-color: #EAF2FB;
                    color: #0D4F8B;
                    padding: 8px 14px;
                    font-size: 13px;
                    font-weight: 600;
                    white-space: nowrap;
                }

                .favorites-grid {
                    display: grid;
                    grid-template-columns: repeat(3, minmax(0, 1fr));
                    gap: 22px;
                }

                .favorite-card {
                    min-width: 0;
                    background-color: #FFFFFF;
                    border: 1px solid #DDE2EA;
                    display: grid;
                    grid-template-columns: 112px minmax(0, 1fr);
                    gap: 20px;
                    padding: 20px;
                    box-shadow: 0 3px 10px rgba(15, 23, 42, 0.04);
                }

                .favorite-cover,
                .favorite-cover-empty {
                    width: 112px;
                    height: 158px;
                    object-fit: cover;
                    background-color: #EEF1F5;
                }

                .favorite-cover-empty {
                    color: #0D4F8B;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    text-align: center;
                    padding: 10px;
                    font-size: 12px;
                    font-weight: 700;
                    line-height: 1.25;
                }

                .favorite-content {
                    min-width: 0;
                    display: flex;
                    flex-direction: column;
                }

                .favorite-title {
                    color: #111827;
                    font-size: 15px;
                    font-weight: 700;
                    text-decoration: none;
                    line-height: 1.3;
                    margin-bottom: 5px;
                }

                .favorite-title:hover {
                    color: #003F63;
                }

                .favorite-author {
                    color: #667085;
                    font-size: 12px;
                    margin-bottom: 12px;
                }

                .favorite-price {
                    color: #E53935;
                    font-size: 15px;
                    font-weight: 700;
                }

                .favorite-old-price {
                    color: #98A2B3;
                    font-size: 12px;
                    margin-left: 7px;
                    text-decoration: line-through;
                }

                .favorite-stock {
                    color: #667085;
                    font-size: 11px;
                    margin-top: 5px;
                }

                .favorite-actions {
                    margin-top: auto;
                    padding-top: 18px;
                    display: flex;
                    align-items: center;
                    gap: 9px;
                }

                .favorite-actions form {
                    margin: 0;
                }

                .favorite-cart,
                .favorite-remove {
                    min-height: 38px;
                    border: 1px solid #0D4F8B;
                    display: inline-flex;
                    align-items: center;
                    justify-content: center;
                    gap: 7px;
                    font-size: 12px;
                    cursor: pointer;
                }

                .favorite-cart {
                    padding: 0 13px;
                    background-color: #0D4F8B;
                    color: #FFFFFF;
                }

                .favorite-cart:hover {
                    background-color: #003F63;
                }
                .favorite-cart:disabled {
                    cursor: not-allowed;
                    opacity: 0.48;
                }

                .favorite-remove {
                    width: 38px;
                    padding: 0;
                    background-color: #FFFFFF;
                    color: #D92D20;
                    border-color: #FDA29B;
                }

                .favorite-remove:hover {
                    background-color: #FFF5F4;
                }

                .favorites-empty {
                    background-color: #FFFFFF;
                    border: 1px solid #DDE2EA;
                    color: #667085;
                    padding: 70px 24px;
                    text-align: center;
                }

                .favorites-empty i {
                    display: block;
                    color: #98A2B3;
                    font-size: 42px;
                    margin-bottom: 16px;
                }

                .favorites-empty strong {
                    display: block;
                    color: #344054;
                    font-size: 17px;
                    margin-bottom: 8px;
                }

                .favorites-return {
                    margin-top: 32px;
                    min-width: 200px;
                    min-height: 46px;
                    padding: 0 20px;
                    background-color: #0D4F8B;
                    border: 1px solid #0D4F8B;
                    color: #FFFFFF;
                    display: inline-flex;
                    align-items: center;
                    justify-content: center;
                    gap: 9px;
                    font-size: 13px;
                    text-decoration: none;
                }

                .favorites-return:hover {
                    color: #FFFFFF;
                    background-color: #003F63;
                }

                @media (max-width: 1100px) {
                    .favorites-grid {
                        grid-template-columns: repeat(2, minmax(0, 1fr));
                    }
                }

                @media (max-width: 720px) {
                    .favorites-heading {
                        align-items: flex-start;
                        flex-direction: column;
                    }
                    .favorites-grid {
                        grid-template-columns: 1fr;
                    }
                }

                @media (max-width: 430px) {
                    .favorite-card {
                        grid-template-columns: 82px minmax(0, 1fr);
                        gap: 14px;
                        padding: 15px;
                    }
                    .favorite-cover, .favorite-cover-empty {
                        width: 82px;
                        height: 120px;
                    }
                    .favorite-actions {
                        flex-wrap: wrap;
                    }
                    .favorite-cart {
                        padding: 0 10px;
                    }
                    .favorites-return {
                        width: 100%;
                    }
                }
            </style>
            <section class="favorites-heading">
                <div>
                    <div class="favorites-kicker">[[#{cliente.favoritos.kicker}]]</div>
                    <h1 class="favorites-title">[[#{cliente.favoritos.titulo}]]</h1>
                    <p class="favorites-description">[[#{cliente.favoritos.descripcion}]]</p>
                </div>
                <span class="favorites-count"
                      th:text="|${librosFavoritos.size()} #{cliente.favoritos.cantidad}|">0 favoritos</span>
            </section>
            <section th:if="${librosFavoritos != null and !librosFavoritos.empty}"
                     class="favorites-grid">
                <article th:each="libro : ${librosFavoritos}"
                         th:with="ofertaLibro=${ofertasPorLibro[libro.idLibro]}"
                         class="favorite-card">
                    <a th:href="@{/cliente/libro/{idLibro}(idLibro=${libro.idLibro})}">
                        <img th:if="${libro.rutaImagen != null and !libro.rutaImagen.isBlank()}"
                             th:src="${libro.rutaImagen}"
                             th:alt="${libro.titulo}"
                             class="favorite-cover"/>

                        <span th:unless="${libro.rutaImagen != null and !libro.rutaImagen.isBlank()}"
                              class="favorite-cover-empty"
                              th:text="${libro.titulo}"></span>
                    </a>
                    <div class="favorite-content">
                        <a th:href="@{/cliente/libro/{idLibro}(idLibro=${libro.idLibro})}"
                           class="favorite-title"
                           th:text="${libro.titulo}"></a>
                        <div class="favorite-author"
                             th:text="${libro.autor != null ? libro.autor.nombre : #messages.msg('cliente.libro.sinAutor')}"></div>
                        <div>
                            <span class="favorite-price">
                                ₡<span th:text="${#numbers.formatDecimal(ofertaLibro != null ? ofertaLibro.precioOferta : libro.precio, 1, 'COMMA', 0, 'POINT')}">0</span>
                            </span>
                            <span th:if="${ofertaLibro != null}" class="favorite-old-price">
                                ₡<span th:text="${#numbers.formatDecimal(libro.precio, 1, 'COMMA', 0, 'POINT')}">0</span>
                            </span>
                        </div>
                        <div class="favorite-stock">
                            [[#{libro.existencias}]]: <span th:text="${libro.existencias}">0</span>
                        </div>

                        <div class="favorite-actions">
                            <form th:action="@{/cliente/carrito/agregar}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <input type="hidden" name="idLibro" th:value="${libro.idLibro}"/>
                                <input type="hidden" name="cantidad" value="1"/>
                                <button type="submit" class="favorite-cart"
                                        th:disabled="${libro.existencias <= 0}">
                                    <i class="fa-solid fa-cart-plus"></i>
                                    <span th:text="${libro.existencias > 0 ? #messages.msg('cliente.carrito.anadir') : #messages.msg('cliente.favoritos.sinStock')}"></span>
                                </button>
                            </form>

                            <form th:action="@{/cliente/favoritos/alternar}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <input type="hidden" name="idLibro" th:value="${libro.idLibro}"/>
                                <input type="hidden" name="retorno" value="favoritos"/>
                                <button type="submit" class="favorite-remove"
                                        th:title="#{cliente.favoritos.quitar}">
                                    <i class="fa-solid fa-heart-crack"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </article>
            </section>

            <section th:if="${librosFavoritos == null or librosFavoritos.empty}"
                     class="favorites-empty">
                <i class="fa-regular fa-heart"></i>
                <strong>[[#{cliente.favoritos.vacio}]]</strong>
                <p>[[#{cliente.favoritos.vacioDescripcion}]]</p>
            </section>

            <a th:href="@{/cliente/inicio}" class="favorites-return">
                <i class="fa-solid fa-arrow-left"></i>
                [[#{cliente.favoritos.regresar}]]
            </a>
        </main>

        <footer th:replace="~{cliente/fragmentos :: footer}"></footer>
        <section th:replace="~{cliente/fragmentos :: scripts}"></section>
    </body>
</html>
